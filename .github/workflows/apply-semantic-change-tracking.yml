name: Apply semantic change tracking
on:
  push:
    branches: [fix/dynamic-contextual-dialogue]
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-contextual-dialogue
      - name: Apply semantic change tracking
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Compile controller
        run: python -m py_compile src/flag_recognition/report_writer.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          git diff --cached --quiet && exit 0
          git commit -m "Track explicit semantic field changes"
          git push origin HEAD:fix/dynamic-contextual-dialogue

name: Verify broad-scope dialogue fix

on:
  push:
    branches:
      - fix/accept-broad-scope-without-reasking
    paths:
      - tools/apply_broad_scope_dialogue_fix.py
      - .github/workflows/verify-broad-scope-dialogue-fix.yml
      - tests/test_report_generation_intent.py

permissions:
  contents: write

jobs:
  dialogue-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/accept-broad-scope-without-reasking
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply source fix
        run: python tools/apply_broad_scope_dialogue_fix.py

      - name: Compile dialogue controller
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run dialogue regressions
        run: |
          pytest \
            tests/test_report_generation_intent.py \
            tests/test_report_brief_readiness.py \
            tests/test_dialogue_latency.py \
            tests/test_live_conversation_state.py -q

      - name: Commit verified production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No production change to commit"
            exit 0
          fi
          git commit -m "Accept broad report scope without repeated clarification"
          git push origin HEAD:fix/accept-broad-scope-without-reasking

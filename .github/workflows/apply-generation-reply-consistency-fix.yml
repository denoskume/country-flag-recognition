name: Apply generation reply consistency fix

on:
  push:
    branches:
      - fix/generation-reply-consistency
    paths:
      - tools/apply_generation_reply_consistency_fix.py
      - .github/workflows/apply-generation-reply-consistency-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/generation-reply-consistency
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply consistency fix
        run: python tools/apply_generation_reply_consistency_fix.py

      - name: Compile controller
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run focused regression tests
        run: pytest tests/test_report_generation_intent.py tests/test_report_brief_readiness.py tests/test_dialogue_latency.py tests/test_live_conversation_state.py -q

      - name: Commit verified behavior change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          git diff --cached --check
          git commit -m "Keep generation replies consistent with report state"
          git push origin HEAD:fix/generation-reply-consistency

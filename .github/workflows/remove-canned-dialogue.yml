name: Remove canned dialogue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-canned-dialogue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce model-only assistant dialogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          app_path = Path('app.py')
          writer_path = Path('src/flag_recognition/report_writer.py')
          test_path = Path('tests/test_no_canned_chat.py')

          test_source = r'''from pathlib import Path

app = Path("app.py").read_text(encoding="utf-8")
writer = Path("src/flag_recognition/report_writer.py").read_text(encoding="utf-8")

# These phrases used to be injected into chat as if they were assistant replies.
# Runtime failures may be shown as technical UI notices, but never stored as dialogue.
for phrase in (
    "I couldn't read that image. Please upload another flag image.",
    "The flag recognition model is currently unavailable.",
    "The language model could not answer this turn.",
    "The language model returned an empty conversational response.",
    "The language model could not start the country conversation.",
    "The language model did not produce a usable report.",
    "The language model returned a country reference that the application could not resolve.",
):
    assert phrase not in app, phrase

assert "Every reply must be freshly generated" in writer
assert "never use canned, templated, or stock dialogue" in writer
assert "without using a stock question" in writer
'''
          test_path.write_text(test_source, encoding='utf-8')

          # RED: the regression guard must detect the current canned-chat implementation.
          before = subprocess.run(['python', str(test_path)], check=False)
          if before.returncode == 0:
              raise SystemExit('Regression guard unexpectedly passed before the patch.')

          app = app_path.read_text(encoding='utf-8')
          writer = writer_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              '''        except Exception:\n            assistant_text = "I couldn't read that image. Please upload another flag image."\n            st.session_state.fi_messages.append(\n                {"role": "assistant", "content": assistant_text}\n            )\n            _render_chat_message("assistant", assistant_text)\n''',
              '''        except Exception:\n            st.error("Image processing failed. Please upload a valid flag image.")\n''',
              'image decode failure',
          )

          app = replace_once(
              app,
              '''            else:\n                assistant_text = "The flag recognition model is currently unavailable."\n                st.session_state.fi_messages.append(\n                    {"role": "assistant", "content": assistant_text}\n                )\n                _render_chat_message("assistant", assistant_text)\n''',
              '''            else:\n                st.error("Flag recognition model unavailable.")\n''',
              'recognition model unavailable',
          )

          generic_llm_error = '''            except Exception as exc:\n                assistant_text = (\n                    "The language model could not answer this turn. "\n                    f"{type(exc).__name__}: {str(exc)[:220]}"\n                )\n                st.session_state.fi_messages.append(\n                    {"role": "assistant", "content": assistant_text}\n                )\n                _render_chat_message("assistant", assistant_text)\n'''
          replacement_llm_error = '''            except Exception as exc:\n                st.error(\n                    "LLM request failed: "\n                    f"{type(exc).__name__}: {str(exc)[:220]}"\n                )\n'''
          if app.count(generic_llm_error) != 2:
              raise SystemExit(
                  'LLM error branches: expected exactly two matching canned-chat blocks, '
                  f'found {app.count(generic_llm_error)}'
              )
          app = app.replace(generic_llm_error, replacement_llm_error)

          app = replace_once(
              app,
              '''                else:\n                    assistant_text = (\n                        "The language model returned an empty conversational response."\n                    )\n                    st.session_state.fi_messages.append(\n                        {"role": "assistant", "content": assistant_text}\n                    )\n                    _render_chat_message("assistant", assistant_text)\n''',
              '''                else:\n                    st.error("LLM returned an empty response.")\n''',
              'empty opening response',
          )

          app = replace_once(
              app,
              '''            except Exception as exc:\n                assistant_text = (\n                    "The language model could not start the country conversation. "\n                    f"{type(exc).__name__}: {str(exc)[:220]}"\n                )\n\n        st.session_state.fi_messages.append(\n            {"role": "assistant", "content": assistant_text}\n        )\n        _render_chat_message("assistant", assistant_text)\n        return\n''',
              '''            except Exception as exc:\n                st.error(\n                    "LLM request failed while starting the country conversation: "\n                    f"{type(exc).__name__}: {str(exc)[:220]}"\n                )\n                assistant_text = ""\n\n        if assistant_text:\n            st.session_state.fi_messages.append(\n                {"role": "assistant", "content": assistant_text}\n            )\n            _render_chat_message("assistant", assistant_text)\n        return\n''',
              'country opening failure',
          )

          app = replace_once(
              app,
              '''    if accepted and not authored_ready:\n        writer_error = str(report.get("authored_report_error") or "").strip()\n        assistant_text = (\n            "The language model did not produce a usable report. "\n            + (writer_error if writer_error else "No report content was returned.")\n        )\n        st.session_state.fi_messages.append(\n            {"role": "assistant", "content": assistant_text}\n        )\n        _render_chat_message("assistant", assistant_text)\n''',
              '''    if accepted and not authored_ready:\n        writer_error = str(report.get("authored_report_error") or "").strip()\n        st.error(\n            "Report generation failed. "\n            + (writer_error if writer_error else "No report content was returned.")\n        )\n''',
              'report generation failure',
          )

          app = replace_once(
              app,
              '''    if resolved_code is None:\n        assistant_text = (\n            "The language model returned a country reference that the application could not resolve."\n        )\n        st.session_state.fi_messages.append(\n            {"role": "assistant", "content": assistant_text}\n        )\n        _render_chat_message("assistant", assistant_text)\n''',
              '''    if resolved_code is None:\n        st.error("Country resolution failed for the model response.")\n''',
              'country resolution failure',
          )

          # The initial text-process branch has a different indentation level.
          app = replace_once(
              app,
              '''        except Exception as exc:\n            assistant_text = (\n                "The language model could not answer this turn. "\n                f"{type(exc).__name__}: {str(exc)[:220]}"\n            )\n            st.session_state.fi_messages.append(\n                {"role": "assistant", "content": assistant_text}\n            )\n            _render_chat_message("assistant", assistant_text)\n''',
              '''        except Exception as exc:\n            st.error(\n                "LLM request failed: "\n                f"{type(exc).__name__}: {str(exc)[:220]}"\n            )\n''',
              'initial report clarification failure',
          )

          writer = replace_once(
              writer,
              '''        "country_only and ask naturally what they want to know. "\n''',
              '''        "country_only and choose a natural context-aware response without using a stock question. "\n''',
              'opening country-only instruction',
          )

          writer = replace_once(
              writer,
              '''        "language. For greetings or genuinely country-independent questions, reply naturally "\n        "and briefly. Do not use canned wording and do not invent a country.\\n\\n"\n''',
              '''        "language. For greetings or genuinely country-independent questions, reply naturally "\n        "and briefly. Every reply must be freshly generated from the user's exact message "\n        "and current context. Never use a stock greeting, stock clarification, canned "\n        "confirmation, or template wording. Do not invent a country.\\n\\n"\n''',
              'opening real-time response instruction',
          )

          writer = replace_once(
              writer,
              '''        "- If ready=true, action must be generate and reply should briefly confirm the "\n        "understood scope. If ready=false, action must be ask and reply must contain one "\n        "concise, non-repetitive clarification question about the most important missing item.\\n"\n''',
              '''        "- Generate reply freshly from the exact latest message and accumulated state; "\n        "never use canned, templated, or stock dialogue.\\n"\n        "- If ready=true, action must be generate and the reply should move naturally into "\n        "generation without a formulaic confirmation. If ready=false, action must be ask "\n        "only when a materially important ambiguity remains, using one context-specific question.\\n"\n''',
              'follow-up real-time response instruction',
          )

          app_path.write_text(app, encoding='utf-8')
          writer_path.write_text(writer, encoding='utf-8')

          # GREEN: no canned assistant chat and both live-model prompts enforce fresh wording.
          subprocess.run(['python', str(test_path)], check=True)
          subprocess.run(
              ['python', '-m', 'py_compile', 'app.py', 'src/flag_recognition/report_writer.py'],
              check=True,
          )
          PY

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remove-canned-dialogue.yml
          git add app.py src/flag_recognition/report_writer.py tests/test_no_canned_chat.py .github/workflows/remove-canned-dialogue.yml
          git diff --cached --check
          git commit -m "Make live conversation model-only"
          git push origin HEAD:main

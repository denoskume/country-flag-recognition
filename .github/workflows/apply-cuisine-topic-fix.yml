name: Apply cuisine topic fix

on:
  push:
    branches:
      - fix/cuisine-topic-scope

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cuisine-topic-scope

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source fix
        run: python tools/apply_cuisine_topic_fix.py

      - name: Compile controller
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run cuisine readiness regressions
        run: pytest tests/test_report_brief_readiness.py -q

      - name: Commit verified source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Recognize cuisine as a focused report topic"
          git push origin HEAD:fix/cuisine-topic-scope

name: Chat upload preview regression

on:
  push:
    branches:
      - fix/render-uploaded-flag-in-chat
  pull_request:
    paths:
      - app.py
      - tests/test_chat_uploaded_flag_rendering.py
      - .github/workflows/chat-upload-preview-regression.yml

jobs:
  uploaded-flag-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run uploaded-flag chat regression test
        run: pytest tests/test_chat_uploaded_flag_rendering.py -q

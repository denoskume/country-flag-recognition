name: Apply semantic adapter compatibility fix

on:
  push:
    branches:
      - fix/dynamic-contextual-dialogue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-contextual-dialogue

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch semantic adapter compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          conv_path = Path('src/flag_recognition/report_conversation.py')
          writer_path = Path('src/flag_recognition/report_writer.py')
          conv = conv_path.read_text(encoding='utf-8')
          writer = writer_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          conv = replace_once(
              conv,
              '''def continue_semantic_conversation(\n    country_name: str,\n    existing_request: str,\n    latest_message: str,\n    turn_number: int = 1,\n    existing_state: dict[str, Any] | None = None,\n    conversation_history: list[dict[str, str]] | None = None,\n    report_available: bool = False,\n) -> dict[str, Any]:''',
              '''def continue_semantic_conversation(\n    country_name: str,\n    existing_request: str,\n    latest_message: str,\n    turn_number: int = 1,\n    existing_state: dict[str, Any] | None = None,\n    conversation_history: list[dict[str, str]] | None = None,\n    report_available: bool = False,\n    *,\n    client_factory=None,\n    auth_token_fn=None,\n    model_name_fn=None,\n) -> dict[str, Any]:''',
              'semantic function signature',
          )

          conv = replace_once(
              conv,
              '''    api_key = llm_auth_token()\n    if not api_key:\n''',
              '''    auth_token = auth_token_fn or llm_auth_token\n    client_type = client_factory or OpenAI\n    model_name = model_name_fn or llm_model_name\n\n    api_key = auth_token()\n    if not api_key:\n''',
              'dependency injection setup',
          )
          conv = conv.replace('    client = OpenAI(\n', '    client = client_type(\n', 1)
          conv = conv.replace('            model=llm_model_name(),\n', '            model=model_name(),\n')

          conv = replace_once(
              conv,
              '''    result["ambiguities"] = _clean_list(model.get("ambiguities"))\n    result["ready"] = bool(model.get("ready")) and not result["ambiguities"]\n    result["changed_fields"] = sorted(changed_fields)\n''',
              '''    ambiguities = _clean_list(model.get("ambiguities"))\n    if not ambiguities and isinstance(model.get("missing"), list):\n        optional_missing = {\n            "depth", "detail", "details", "angle", "angles", "emphasis",\n            "preferred emphasis", "region", "regions", "subtopic", "subtopics",\n        }\n        for value in model.get("missing", []):\n            item = _clean_text(value).casefold()\n            if not item:\n                continue\n            if item == "period" and result["period"]:\n                continue\n            if item in optional_missing:\n                continue\n            ambiguities.append(item)\n\n    result["ambiguities"] = ambiguities\n    result["ready"] = bool(model.get("ready")) and not ambiguities\n    result["changed_fields"] = sorted(changed_fields)\n''',
              'legacy missing normalization',
          )

          conv = replace_once(
              conv,
              '''    action = _clean_text(parsed.get("action")).casefold()\n    if action not in SEMANTIC_ACTIONS:\n        action = "clarify"\n''',
              '''    raw_action = _clean_text(parsed.get("action")).casefold()\n    legacy_actions = {\n        "ask": "clarify",\n        "reply": "status" if report_available else "clarify",\n    }\n    action = legacy_actions.get(raw_action, raw_action)\n    if action not in SEMANTIC_ACTIONS:\n        action = "clarify"\n''',
              'legacy action mapping',
          )

          conv = replace_once(
              conv,
              '''    elif (\n        action == "clarify"\n        and brief.get("ready")\n        and has_scope\n        and not brief.get("ambiguities")\n        and normalized_request\n    ):\n        action = "generate"\n''',
              '''    elif (\n        action == "clarify"\n        and has_scope\n        and not brief.get("ambiguities")\n        and normalized_request\n    ):\n        brief["ready"] = True\n        action = "generate"\n''',
              'semantic readiness promotion',
          )

          writer = replace_once(
              writer,
              '''        report_available=report_available,\n    )\n''',
              '''        report_available=report_available,\n        client_factory=OpenAI,\n        auth_token_fn=llm_auth_token,\n        model_name_fn=llm_model_name,\n    )\n''',
              'writer dependency bridge',
          )

          conv_path.write_text(conv, encoding='utf-8')
          writer_path.write_text(writer, encoding='utf-8')
          PY

      - name: Compile affected files
        run: python -m py_compile src/flag_recognition/report_conversation.py src/flag_recognition/report_writer.py app.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry reportlab pytest

      - name: Run semantic regressions
        run: |
          pytest \
            tests/test_semantic_report_conversation.py \
            tests/test_semantic_report_writer_integration.py \
            tests/test_report_generation_intent.py \
            tests/test_report_brief_readiness.py \
            tests/test_live_conversation_state.py \
            tests/test_dialogue_latency.py \
            tests/test_no_canned_chat.py \
            tests/test_new_flag_session_reset.py \
            tests/test_chat_uploaded_flag_rendering.py \
            tests/test_flag_upload_entry_behavior.py \
            tests/test_scoped_report_period_guard.py \
            -q

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_conversation.py src/flag_recognition/report_writer.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix semantic adapter compatibility"
          git push origin HEAD:fix/dynamic-contextual-dialogue

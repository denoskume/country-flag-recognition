name: Fix report generation state

on:
  push:
    branches:
      - fix/report-generation-state
    paths:
      - tools/fix_report_generation_state.py
      - .github/workflows/fix-report-generation-state.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/report-generation-state
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic report-generation fix
        run: python tools/fix_report_generation_state.py

      - name: Compile changed production module
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run regression tests
        run: pytest tests/test_report_generation_intent.py tests/test_dialogue_latency.py tests/test_live_conversation_state.py -q

      - name: Run full test suite
        id: full_tests
        continue-on-error: true
        run: pytest -q --junitxml=pytest-results.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-generation-pytest-results
          path: pytest-results.xml
          if-no-files-found: error

      - name: Require full test suite success
        if: steps.full_tests.outcome != 'success'
        run: exit 1

      - name: Commit verified production change
        run: |
          if git diff --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          git diff --cached --check
          git commit -m "Fix Flag Intelligence report generation state"
          git push origin HEAD:fix/report-generation-state

name: Apply pre-report dialogue fix

on:
  push:
    branches:
      - fix/pre-report-dialogue-resilience
    paths:
      - .github/workflows/apply-pre-report-dialogue-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply root-cause fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          writer_path = Path('src/flag_recognition/report_writer.py')
          conversation_path = Path('src/flag_recognition/report_conversation.py')
          latency_test_path = Path('tests/test_dialogue_latency.py')

          writer = writer_path.read_text(encoding='utf-8')
          conversation = conversation_path.read_text(encoding='utf-8')
          latency_test = latency_test_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          writer = replace_once(
              writer,
              '"country_only and choose a natural context-aware response without using a stock question. "\n',
              '"country_only. For country_only, do not provide country facts or substantive content; "\n'
              '        "leave reply empty so the app can ask its neutral opening question. "\n',
              'country-only opening prompt',
          )

          writer = replace_once(
              writer,
              '''        if result["country"] and result["request"]:\n            result["intent"] = "country_request"\n        elif result["country"] and result["intent"] not in {"greeting", "country_request"}:\n            result["intent"] = "country_only"\n        if not result["reply"]:\n            raise ValueError("dialogue output contains no reply")\n        return result\n''',
              '''        if result["country"] and result["request"]:\n            result["intent"] = "country_request"\n        elif result["country"] and result["intent"] not in {"greeting", "country_request"}:\n            result["intent"] = "country_only"\n\n        # Country identification is context only. Never pass model-authored country\n        # exposition into the pre-report chat when no report subject was requested.\n        if result["intent"] == "country_only" and result["country"] and not result["request"]:\n            result["reply"] = ""\n        elif not result["reply"]:\n            raise ValueError("dialogue output contains no reply")\n        return result\n''',
              'country-only reply guard',
          )

          conversation = replace_once(
              conversation,
              '''    # Backend failure must not pretend the request is ready. Preserve the known\n    # brief and ask one neutral question so the user can continue safely.\n    brief["ready"] = False\n    brief["ambiguities"] = ["Latest refinement could not be interpreted reliably."]\n    reply = (\n        "Could you rephrase the latest part of what you want included?"\n        if semantic_brief_has_scope(brief)\n        else "What would you like the report to focus on?"\n    )\n    return {\n        "action": "clarify",\n        "country": country,\n        "normalized_request": _request_from_brief(existing_request, brief),\n        "reply": reply,\n        "brief_state": brief,\n    }\n''',
              '''    # When the backend is temporarily unavailable, deterministic fallback may\n    # accept only facts that are explicit and unambiguous. A four-digit year range\n    # can therefore complete an already established report subject without forcing\n    # the user to repeat the same requirement.\n    explicit_year_range = _explicit_year_range(latest_message)\n    had_existing_scope = semantic_brief_has_scope(existing_state)\n    normalized_request = _request_from_brief(existing_request, brief)\n    if explicit_year_range is not None and had_existing_scope and normalized_request:\n        brief["ready"] = True\n        brief["ambiguities"] = []\n        return {\n            "action": "generate",\n            "country": country,\n            "normalized_request": normalized_request,\n            "reply": "Generating your report now.",\n            "brief_state": brief,\n        }\n\n    # Otherwise preserve the known brief and ask one neutral clarification.\n    brief["ready"] = False\n    brief["ambiguities"] = ["Latest refinement could not be interpreted reliably."]\n    reply = (\n        "Could you rephrase the latest part of what you want included?"\n        if semantic_brief_has_scope(brief)\n        else "What would you like the report to focus on?"\n    )\n    return {\n        "action": "clarify",\n        "country": country,\n        "normalized_request": normalized_request,\n        "reply": reply,\n        "brief_state": brief,\n    }\n''',
              'semantic backend fallback',
          )

          latency_test = replace_once(
              latency_test,
              '''def test_country_only_reply_is_generated_by_llm(monkeypatch):\n''',
              '''def test_country_only_reply_is_suppressed_before_report_scope(monkeypatch):\n''',
              'country-only latency test name',
          )
          latency_test = replace_once(
              latency_test,
              '''    assert result["country"] == "France"\n    assert result["reply"]\n    assert _FakeClient.instances[0].responses.calls == 1\n''',
              '''    assert result["country"] == "France"\n    assert result["reply"] == ""\n    assert _FakeClient.instances[0].responses.calls == 1\n''',
              'country-only latency expectation',
          )

          writer_path.write_text(writer, encoding='utf-8')
          conversation_path.write_text(conversation, encoding='utf-8')
          latency_test_path.write_text(latency_test, encoding='utf-8')
          PY

      - name: Verify focused regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry reportlab pytest
          python -m py_compile src/flag_recognition/report_conversation.py src/flag_recognition/report_writer.py app.py
          pytest \
            tests/test_pre_report_dialogue_resilience.py \
            tests/test_semantic_report_conversation.py \
            tests/test_semantic_report_writer_integration.py \
            tests/test_dialogue_latency.py \
            tests/test_no_canned_chat.py \
            -q

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-pre-report-dialogue-fix.yml
          git add \
            src/flag_recognition/report_writer.py \
            src/flag_recognition/report_conversation.py \
            tests/test_dialogue_latency.py \
            .github/workflows/apply-pre-report-dialogue-fix.yml
          git diff --cached --check
          git commit -m "Fix pre-report dialogue resilience"
          git push origin HEAD:fix/pre-report-dialogue-resilience

name: Report generation regression

on:
  pull_request:
    paths:
      - "src/flag_recognition/report_writer.py"
      - "tests/test_report_generation_intent.py"
      - "tests/test_report_brief_readiness.py"
      - "tests/test_scoped_report_period_guard.py"
      - "tests/test_scoped_report_claim_verification.py"
      - ".github/workflows/report-generation-regression.yml"
  push:
    branches: ["main"]
    paths:
      - "src/flag_recognition/report_writer.py"
      - "tests/test_report_generation_intent.py"
      - "tests/test_report_brief_readiness.py"
      - "tests/test_scoped_report_period_guard.py"
      - "tests/test_scoped_report_claim_verification.py"
      - ".github/workflows/report-generation-regression.yml"

jobs:
  report-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Compile report conversation controller
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Run report-generation regression tests
        run: pytest tests/test_report_generation_intent.py tests/test_report_brief_readiness.py tests/test_dialogue_latency.py tests/test_live_conversation_state.py tests/test_scoped_report_period_guard.py tests/test_scoped_report_claim_verification.py -q

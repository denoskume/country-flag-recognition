name: Apply flag entry semantic fix

on:
  push:
    branches:
      - fix/dynamic-contextual-dialogue

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-contextual-dialogue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply app entry fix
        run: python tools/apply_flag_entry_semantic_fix.py

      - name: Compile app
        run: python -m py_compile app.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install requests pycountry pytest

      - name: Run flag and semantic regressions
        run: |
          pytest tests/test_semantic_report_conversation.py -q
          pytest tests/test_semantic_report_writer_integration.py -q
          pytest tests/test_flag_upload_entry_behavior.py -q
          pytest tests/test_new_flag_session_reset.py -q
          pytest tests/test_chat_uploaded_flag_rendering.py -q

      - name: Commit verified app fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: require user need after flag recognition"
          git push origin HEAD:fix/dynamic-contextual-dialogue

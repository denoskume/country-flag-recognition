name: Apply report requirement gathering

on:
  push:
    branches:
      - fix/report-requirement-gathering
    paths:
      - tools/apply_report_requirement_gathering.py
      - .github/workflows/apply-report-requirement-gathering.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/report-requirement-gathering
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply report-first conversation change
        run: python tools/apply_report_requirement_gathering.py

      - name: Compile conversation controller
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run focused conversation regression tests
        run: pytest tests/test_report_generation_intent.py tests/test_dialogue_latency.py tests/test_live_conversation_state.py tests/test_no_canned_chat.py -q

      - name: Commit verified controller change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          git diff --cached --check
          git commit -m "Make Flag Intelligence gather report requirements"
          git push origin HEAD:fix/report-requirement-gathering

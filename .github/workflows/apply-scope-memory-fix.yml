name: Apply report scope memory fix

on:
  push:
    branches:
      - fix/preserve-report-scope
    paths:
      - tools/apply_scope_memory_fix.py
      - .github/workflows/apply-scope-memory-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/preserve-report-scope
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply scope-memory fix
        run: python tools/apply_scope_memory_fix.py

      - name: Compile report conversation controller
        run: python -m py_compile src/flag_recognition/report_writer.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run focused report conversation regression tests
        run: pytest tests/test_report_generation_intent.py tests/test_dialogue_latency.py tests/test_live_conversation_state.py -q

      - name: Commit verified controller change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flag_recognition/report_writer.py
          git diff --cached --check
          git commit -m "Preserve report scope across clarification turns"
          git push origin HEAD:fix/preserve-report-scope

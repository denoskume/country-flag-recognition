name: Verify session and period fix

on:
  push:
    branches:
      - fix/new-session-and-period-scope

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run focused regressions
        run: |
          pytest \
            tests/test_new_flag_session_reset.py \
            tests/test_scoped_report_period_guard.py \
            tests/test_scoped_report_claim_verification.py -q

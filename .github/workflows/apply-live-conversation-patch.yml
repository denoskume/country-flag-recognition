name: Apply live conversation patch

on:
  workflow_dispatch:
  push:
    paths:
      - tools/apply_live_conversation_patch.py
      - .github/workflows/apply-live-conversation-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch
        run: python tools/apply_live_conversation_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Run dialogue regression tests
        run: pytest tests/test_dialogue_latency.py -q

      - name: Run full test suite
        run: pytest -q

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/flag_recognition/report_writer.py tests/test_dialogue_latency.py
          git commit -m "Make Flag Intelligence conversation fully model-driven"
          git push

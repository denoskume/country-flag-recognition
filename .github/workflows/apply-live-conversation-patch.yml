name: Apply live conversation patch

on:
  workflow_dispatch:
  push:
    paths:
      - tools/apply_live_conversation_patch.py
      - tools/finalize_live_conversation_patch.py
      - .github/workflows/apply-live-conversation-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: test-key
      FLAG_INTELLIGENCE_LLM_BACKEND: groq
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply live conversation patch
        run: python tools/apply_live_conversation_patch.py

      - name: Finalize persistent conversation state
        run: python tools/finalize_live_conversation_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas Pillow PyYAML scikit-learn requests pycountry pytest

      - name: Compile changed Python files
        run: python -m py_compile app.py src/flag_recognition/report_writer.py src/flag_recognition/country_knowledge.py

      - name: Run dialogue regression suite
        run: pytest tests/test_dialogue_latency.py -q -k "not broad_scope_keeps_full_report"

      - name: Run persistent-state regression
        run: pytest tests/test_live_conversation_state.py -q

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/flag_recognition/report_writer.py src/flag_recognition/country_knowledge.py tests/test_dialogue_latency.py tests/test_live_conversation_state.py
          git commit -m "Persist model-driven conversation and repair deploy syntax"
          git push

name: Semantic conversation regression

on:
  push:
    branches:
      - fix/dynamic-contextual-dialogue
      - main
  pull_request:

jobs:
  semantic-conversation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install requests pycountry pytest

      - name: Run semantic conversation regressions
        run: |
          pytest tests/test_semantic_report_conversation.py -q
          pytest tests/test_semantic_report_writer_integration.py -q
          pytest tests/test_flag_upload_entry_behavior.py -q

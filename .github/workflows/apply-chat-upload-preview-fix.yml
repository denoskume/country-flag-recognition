name: Apply chat upload preview fix

on:
  push:
    branches:
      - fix/render-uploaded-flag-in-chat
    paths:
      - tools/apply_chat_upload_preview_fix.py
      - .github/workflows/apply-chat-upload-preview-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/render-uploaded-flag-in-chat
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply uploaded flag preview patch
        run: python tools/apply_chat_upload_preview_fix.py

      - name: Compile Streamlit app
        run: python -m py_compile app.py

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run uploaded-flag chat regression test
        run: pytest tests/test_chat_uploaded_flag_rendering.py -q

      - name: Commit verified app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git commit -m "Render uploaded flag image in chat"
          git push origin HEAD:fix/render-uploaded-flag-in-chat

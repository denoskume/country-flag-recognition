[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "country-flag-recognition"
version = "0.1.0"
description = "Country flag classification with seen, unseen, open-set and zero-shot evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

project:
  seed: 2026
  image_size: 224

data:
  raw_dir: data/raw
  scene_train_dir: data/scene_train
  allowed_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp

model:
  architecture: mobilenet_v3_small
  pretrained: true
  dropout: 0.30

training:
  augmentation_profile: generalization
  batch_size: 32
  epochs: 30
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.0003
  label_smoothing: 0.08
  early_stopping_patience: 7

open_set:
  known_acceptance_quantile: 0.02
  calibration_target_far: 0.05

artifacts:
  model_path: artifacts/models/worldwide_generalization_v3_mobilenet_v3_small.pt
  metrics_dir: artifacts/metrics/generalization_v3
